# Công tắc chuyển đổi (false = dùng Supabase cũ, true = dùng hệ thống mới)
USE_NEW_DB = false
USE_NEW_STORAGE = false

# --- Cấu hình cũ: Supabase ---
[supabase]
url = "https://your-supabase-url.supabase.co"
key = "your-supabase-anon-key"

# --- Cấu hình mới chờ sẵn: Neon (Database) ---
[neon]
connection_string = "postgresql://user:password@ep-xxx.neon.tech/neondb"

# --- Cấu hình mới chờ sẵn: Cloudinary (Storage) ---
[cloudinary]
cloud_name = "your_cloud_name"
api_key = "your_api_key"
api_secret = "your_api_secret"
